[package]
name = "fermata-attest"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Fermata attestor: TLSNotary prover, notary and verifier; binds a presentation to an on-chain hold and signs an EIP-712 verdict"

[lib]
name = "fermata_attest"

[[bin]]
name = "fermata-attest"
path = "src/main.rs"

[dependencies]
# TLSNotary v0.1.0-alpha.15 (git only; not on crates.io). Same pin as the spike and WebProof.
# `mozilla-certs`: Mozilla roots for real vendors (webpki-root-certs is already a tlsn-core dependency).
tlsn = { git = "https://github.com/tlsnotary/tlsn", rev = "47aee45b53e06648c1b2ad3689b367b8c923fdec", features = ["mozilla-certs"] }

anyhow = "1"
base64 = "0.22"
bincode = "1.3"
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
http-body-util = "0.1"
httparse = "1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["full"] }
k256 = { version = "0.13", features = ["ecdsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "fs", "sync", "process", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webpki-roots = "1"

# MPC is far too slow unoptimised; keep dependencies optimised even in dev/test builds.
[profile.dev.package."*"]
opt-level = 3
