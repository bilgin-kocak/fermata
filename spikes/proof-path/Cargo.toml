[package]
name = "spike-attest"
version = "0.0.0"
edition = "2024"
publish = false
description = "Fermata Milestone S probe 1: TLSNotary prover / TCP notary / offline verifier + EIP-712 verdict (throwaway spike)"

[dependencies]
# TLSNotary, pinned to release tag v0.1.0-alpha.15 (not on crates.io). Same pin as WebProof.
tlsn = { git = "https://github.com/tlsnotary/tlsn", rev = "47aee45b53e06648c1b2ad3689b367b8c923fdec" }
tlsn-formats = { git = "https://github.com/tlsnotary/tlsn", rev = "47aee45b53e06648c1b2ad3689b367b8c923fdec" }

anyhow = "1"
bincode = "1.3"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
hex = "0.4"
http-body-util = "0.1"
httparse = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["full"] }
k256 = { version = "0.13", features = ["ecdsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "fs"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# MPC is far too slow unoptimised; keep dependencies optimised even in dev builds (as upstream does).
[profile.dev.package."*"]
opt-level = 3
